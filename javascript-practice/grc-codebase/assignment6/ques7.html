<!DOCTYPE html>
<html>
<head>
<style>
#box {
    width: 400px;
    height: 400px;
    border: 2px solid black;
    background: #eeeeee;
    position: relative;
    cursor: crosshair;
}

.dot {
    position: absolute;
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}
</style>
</head>

<body>

<h2>Mouse Coordinates Logger</h2>

<p id="coordinates">Move mouse inside the box</p>

<div id="box"></div>

<script>
const box = document.getElementById("box");
const coordinates = document.getElementById("coordinates");

// Track mouse coordinates
box.addEventListener("mousemove", function(event) {
    coordinates.textContent =
        `Client X: ${event.clientX}, Client Y: ${event.clientY}`;
});

// Double-click to add red dot
box.addEventListener("dblclick", function(event) {
    let rect = box.getBoundingClientRect();

    let x = event.clientX - rect.left - box.clientLeft;
    let y = event.clientY - rect.top - box.clientTop;

    let dot = document.createElement("div");

    dot.className = "dot";

    dot.style.left = x + "px";
    dot.style.top = y + "px";

    box.appendChild(dot);
});
</script>

</body>
</html>
