<!DOCTYPE html>
<html>
<head>
<style>
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 150px);
    gap: 10px;
}

.gallery img {
    width: 150px;
    height: 120px;
    object-fit: cover;
    cursor: pointer;
}

#modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}

#modal img {
    width: 500px;
    max-width: 90%;
}
</style>
</head>
<body>

<h2>Image Gallery</h2>

<div class="gallery" id="gallery">
    <img src="https://picsum.photos/id/10/300/200" alt="Gallery 1">
    <img src="https://picsum.photos/id/20/300/200" alt="Gallery 2">
    <img src="https://picsum.photos/id/30/300/200" alt="Gallery 3">
    <img src="https://picsum.photos/id/40/300/200" alt="Gallery 4">
    <img src="https://picsum.photos/id/50/300/200" alt="Gallery 5">
    <img src="https://picsum.photos/id/60/300/200" alt="Gallery 6">
</div>

<div id="modal">
    <img id="modalImage" alt="Large preview">
</div>

<script>
const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalImage = document.getElementById("modalImage");

gallery.addEventListener("click", function(event) {
    if (event.target.tagName === "IMG") {
        modalImage.src = event.target.src.replace("/300/200", "/900/600");
        modal.style.display = "flex";
    }
});

// Clicking outside closes modal
modal.addEventListener("click", function() {
    modal.style.display = "none";
});

// Clicking image should not close modal
modalImage.addEventListener("click", function(event) {
    event.stopPropagation();
});
</script>

</body>
</html>
