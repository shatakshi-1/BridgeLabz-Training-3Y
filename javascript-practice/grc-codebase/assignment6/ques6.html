<!DOCTYPE html>
<html>
<body>

<h2>Student Table Filter</h2>

<input id="search" placeholder="Search students">

<br><br>

<table border="1" cellpadding="10" id="studentTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Branch</th>
            <th>CGPA</th>
        </tr>
    </thead>

    <tbody>
        <tr><td>Aman</td><td>CSE</td><td>8.5</td></tr>
        <tr><td>Riya</td><td>ECE</td><td>9.1</td></tr>
        <tr><td>Rahul</td><td>ME</td><td>7.8</td></tr>
        <tr><td>Neha</td><td>CSE</td><td>8.9</td></tr>
        <tr><td>Priya</td><td>IT</td><td>9.2</td></tr>
    </tbody>
</table>

<p id="message"></p>

<script>
const search = document.getElementById("search");

search.addEventListener("input", function() {
    let keyword = search.value.toLowerCase();

    let rows = document.querySelectorAll("#studentTable tbody tr");

    let count = 0;

    rows.forEach(row => {
        let text = row.textContent.toLowerCase();

        if (text.includes(keyword)) {
            row.style.display = "";
            count++;
        } else {
            row.style.display = "none";
        }
    });

    document.getElementById("message").textContent =
        count === 0 ? "No results found" : "";
});
</script>

</body>
</html>
