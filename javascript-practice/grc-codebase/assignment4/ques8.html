<!DOCTYPE html>
<html>
<body>

<h2>Update User Details</h2>

<form id="userForm">
    <input id="name" placeholder="Name" required><br><br>
    <input id="email" type="email" placeholder="Email" required><br><br>
    <input id="age" type="number" placeholder="Age" min="1" required><br><br>

    <button type="submit">Update</button>
</form>

<h3>Updated User:</h3>
<pre id="result"></pre>

<script>
let user = {
    name: "John",
    email: "john@mail.com",
    age: 21
};

document.getElementById("name").value = user.name;
document.getElementById("email").value = user.email;
document.getElementById("age").value = user.age;

function displayUser() {
    document.getElementById("result").textContent =
        JSON.stringify(user, null, 2);
}

displayUser();

document.getElementById("userForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    user.name = document.getElementById("name").value;
    user.email = document.getElementById("email").value;
    user.age = Number(document.getElementById("age").value);

    displayUser();
});
</script>

</body>
</html>
