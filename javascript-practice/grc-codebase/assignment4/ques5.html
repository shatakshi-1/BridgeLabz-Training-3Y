<!DOCTYPE html>
<html>
<body>

<h2>Movie Ticket Booking</h2>

<form id="bookingForm" novalidate>
    <input id="name" placeholder="Name"><br><br>
    <input id="email" placeholder="Email"><br><br>
    <input id="seats" type="number" placeholder="Seats"><br><br>

    <button type="submit">Book Ticket</button>
</form>

<p id="result"></p>

<script>
document.getElementById("bookingForm")
.addEventListener("submit", function(event) {
    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let seats = document.getElementById("seats").value.trim();
    let result = document.getElementById("result");

    if (!/^[A-Za-z]+(?: [A-Za-z]+)*$/.test(name)) {
        result.textContent = "Invalid name";
        return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        result.textContent = "Invalid email";
        return;
    }

    if (!/^(10|[1-9])$/.test(seats)) {
        result.textContent = "Seats must be between 1 and 10";
        return;
    }

    let booking = {
        name: name,
        email: email,
        seats: Number(seats)
    };

    result.innerHTML = `
        <h3>Booking Successful!</h3>
        Name: ${booking.name}<br>
        Email: ${booking.email}<br>
        Seats: ${booking.seats}
    `;
});
</script>

</body>
</html>
