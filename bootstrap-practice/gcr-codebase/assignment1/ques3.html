
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ques3.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>ShopEasy</h1>
    <p>Explore Our Latest Products</p>
</header>

<main class="container mt-5">

    <h2 class="text-center mb-4">Our Products</h2>

    <!-- 1 column mobile, 2 tablet, 4 desktop -->
    <div class="row g-4">

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm h-100">
                <img src="https://picsum.photos/seed/headphones/300/200"
                     class="card-img-top" alt="Headphones">

                <div class="card-body">
                    <h5>Headphones</h5>
                    <p class="fw-bold">₹1,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm h-100">
                <img src="https://picsum.photos/seed/watch/300/200"
                     class="card-img-top" alt="Watch">

                <div class="card-body">
                    <h5>Smart Watch</h5>
                    <p class="fw-bold">₹2,499</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm h-100">
                <img src="https://picsum.photos/seed/shoes/300/200"
                     class="card-img-top" alt="Shoes">

                <div class="card-body">
                    <h5>Sports Shoes</h5>
                    <p class="fw-bold">₹1,999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm h-100">
                <img src="https://picsum.photos/seed/bag/300/200"
                     class="card-img-top" alt="Bag">

                <div class="card-body">
                    <h5>Backpack</h5>
                    <p class="fw-bold">₹999</p>
                    <button class="btn btn-primary">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 ShopEasy
</footer>

</body>
</html>
