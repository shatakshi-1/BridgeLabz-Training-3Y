
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ques2.css">
</head>
<body class="bg-light text-dark">

<header class="bg-dark text-white text-center p-5">
    <h1 class="fw-bold">Shatakshi</h1>
    <p class="lead">Web Developer | Tech Enthusiast</p>
</header>

<main class="container text-center mt-4">

    <!-- Profile Image -->
    <img src="https://picsum.photos/200"
         class="img-fluid rounded-circle mb-3 profile"
         alt="Profile Image">

    <h2 class="fw-bold">About Me</h2>

    <p>
        I am a Computer Science student interested in
        web development, data analytics and technology.
    </p>

    <div class="mb-4">
        <a href="mailto:hello@example.com" class="btn btn-primary">
            Hire Me
        </a>

        <a href="cv.pdf" download class="btn btn-outline-dark">
            Download CV
        </a>
    </div>

    <!-- Contact Form -->
    <section class="bg-white p-5 rounded shadow-sm mx-auto contact">
        <h3 class="mb-3">Contact Me</h3>

        <form action="mailto:hello@example.com"
              method="post" enctype="text/plain">

            <input type="text"
                   name="name"
                   class="form-control mb-3"
                   placeholder="Enter your name"
                   required>

            <input type="email"
                   name="email"
                   class="form-control mb-3"
                   placeholder="Enter your email"
                   required>

            <textarea name="message"
                      class="form-control mb-3"
                      placeholder="Your message"
                      required></textarea>

            <button type="submit" class="btn btn-success">
                Submit
            </button>
        </form>
    </section>

</main>

<footer class="text-center p-4 mt-4">
    © 2026 My Portfolio
</footer>

</body>
</html>
