
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ques1.css">
</head>
<body>

<header class="bg-dark text-white">
    <nav class="container navbar navbar-dark">
        <a class="navbar-brand fw-bold" href="#">TechNova</a>

        <div class="d-flex gap-3">
            <a href="#home" class="text-white">Home</a>
            <a href="#about" class="text-white">About</a>
            <a href="#services" class="text-white">Services</a>
        </div>
    </nav>
</header>

<main>
    <!-- Hero Section -->
    <section class="hero p-5" id="home">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-md-6">
                    <h1 class="display-4 fw-bold">
                        Grow Your Business With Us
                    </h1>

                    <p class="lead">
                        We provide innovative digital solutions
                        to help your business grow.
                    </p>

                    <a href="#services" class="btn btn-primary btn-lg">
                        Get Started
                    </a>
                </div>

                <div class="col-md-6 mt-4">
                    <img src="https://picsum.photos/600/400"
                         class="img-fluid rounded"
                         alt="Company">
                </div>

            </div>
        </div>
    </section>

    <section class="container py-5" id="services">
        <h2 class="text-center mb-4">Our Services</h2>

        <div class="row text-center g-3">
            <div class="col-md-4">
                <div class="p-4 border rounded">Web Development</div>
            </div>

            <div class="col-md-4">
                <div class="p-4 border rounded">App Development</div>
            </div>

            <div class="col-md-4">
                <div class="p-4 border rounded">Digital Marketing</div>
            </div>
        </div>
    </section>

    <section class="container py-4" id="about">
        <h2>About Us</h2>
        <p>We build simple and useful digital solutions.</p>
    </section>
</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 TechNova. All Rights Reserved.
</footer>

</body>
</html>
