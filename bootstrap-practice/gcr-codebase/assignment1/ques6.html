
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="ques6.css">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Notifications Dashboard</h1>
</header>

<main class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h3 class="mb-4">Recent Notifications</h3>

            <!-- Success Alert -->
            <div class="alert alert-success" role="alert">
                <strong>Success!</strong>
                You have received a new message.
            </div>

            <!-- Info Alert -->
            <div class="alert alert-info" role="alert">
                <strong>Tip:</strong>
                Complete your profile to improve your experience.
            </div>

            <!-- Dismissible Danger Alert -->
            <div class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                <strong>Warning!</strong>
                Your password will expire soon.

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"></button>
            </div>

            <!-- Summary Well using Bootstrap 5 -->
            <section class="bg-light border rounded p-4 mt-4">
                <h4>Notification Summary</h4>

                <p class="mb-0">
                    You have 3 notifications.
                    Please check your important alerts.
                </p>
            </section>

        </div>
    </div>

</main>

<!-- Bootstrap JS required for dismissible alert -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
