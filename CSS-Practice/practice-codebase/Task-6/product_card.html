<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="./product_card.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css%22&gt">
</head>
<body>
    
    <div class="card">


        <div class="image-section">

            <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=800&q=80"
     alt="Black Sneakers">


            <div class="discount">
                20% OFF
            </div>


            <div class="heart">
                ♡
            </div>

        </div>


        <div class="details">

            <div class="category">
                SPORTS SHOES
            </div>

            <div class="product-name">
                Premium Running Shoes
            </div>


            <div class="rating">
                <span>★ ★ ★ ★ ★</span>
                <span class="reviews">(120)</span>
            </div>


            <div class="price">
                ₹1,999
                <span class="old-price">₹2,499</span>
            </div>


            <button class="cart-button">
                Add to Cart
            </button>

        </div>

    </div>
      
</body>
</html>
