<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Student Registration Form</h1>
    <table border="i" cellpadding="10" cellspacing="0"  width="900" height="50"style="margin: auto;">
        <tr height="50">
            <th style="text-align: center;" colspan="2"> <b>Registration Form </b></th>
        </tr>

        <tr height="50" >
            <td style="width: 30%;"> Full Name</td>
           <td><input type="text" placeholder="ENTER YOUR NAME" style="width: 30%;"></td>
        </tr>
        
        <tr height="50">
            <td style="width: 30%;">Email</td>
            <td> <input type="text" placeholder="abc@gmail.com" style="width: 30%;"></td>
        </tr>

        <tr height="50">
            <td style="width: 30%;"> Phone Number</td>
            <td ><input style="width: 30%;" type="number" placeholder="9573836727"></td>
        </tr>

        <tr height="50">
            <td>Date of Birth</td>
            <td> <input style="width: 30%;" placeholder="dd-mm-yyyy" type="date"></td>
        </tr>

        <tr height="50">
            <td style="width: 30%;"> Gender</td>
            <td>
                <section>
                    <input name="Gender" type="radio">
                    <label> Male</label>
                    <input name="Gender" type="radio">
                    <label> Female</label>
                    <input name="Gender" type="radio">
                    <label>other</label>
                </section>
            
            </td>

        </tr>

        <tr height="50">
            <td> Skills</td>
            <td>
                <section>
                    <input name="Skills" type="checkbox">
                    <label>HTML</label>
                    <input name="Skills" type="checkbox">
                    <label>CSS</label>
                    <input name="Skills" type="checkbox">
                    <label>Java Script</label>
                </section>
            </td>
        </tr>

        <tr height="50">
            <td>Course</td>
            <td>
                <select name="Course">
                    <option>--Select Course--</option>
                    <option>B.Tech</option>
                    <option>BBA</option>
                    <option>BCA</option>
                    <option>B.Com</option>
                    <option>BA</option>
                </select>
            </td>
        </tr>

        <tr height="50">
            <td>Address</td>
            <td><textarea> </textarea></td>
        </tr>

        <tr height="50">
            <td>Upload Resume</td>
            <td>
                <button>Choose File</button>
                No file choosen
            </td>
        </tr>

        <tr height="50">
            <th style="text-align: center;" colspan="2"> 
                <button>Register</button>
                <button>Reset</button>

            </th>
        </tr>


    </table>
</body>
</html>
