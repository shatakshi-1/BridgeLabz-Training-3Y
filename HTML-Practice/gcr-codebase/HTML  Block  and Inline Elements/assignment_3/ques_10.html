<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Select Your Travel Preferences</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>France</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>India Gate</option>
    </select>

    <p>
        My selected choices are India, Uttar Pradesh, Mathura,
        and Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
