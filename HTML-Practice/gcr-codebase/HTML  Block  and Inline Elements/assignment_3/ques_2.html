<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>

    <h1>Online Store Product Catalog</h1>

    <table>
        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td><img src="laptop.jpg" alt="Laptop" width="100"></td>
            <td>Laptop</td>
            <td>High-performance laptop for students.</td>
            <td>₹50,000</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td><img src="headphones.jpg" alt="Headphones" width="100"></td>
            <td>Headphones</td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,000</td>
            <td>In Stock</td>
        </tr>

        <tr>
            <td rowspan="2">Special Offer</td>
            <td colspan="2">Buy any two products and get a discount.</td>
            <td colspan="2">Available</td>
        </tr>

        <tr>
            <td colspan="4">Limited Time Offer</td>
        </tr>
    </table>

</body>
</html>
