<!DOCTYPE html>
<html>
<head>
    <title>Payment Form</title>
</head>
<body>

<h1>Payment Form</h1>

<form action="#" method="post">

    <label>Cardholder Name:</label>
    <input type="text"
           name="cardholder"
           required>

    <br><br>

    <label>Card Number:</label>
    <input type="text"
           name="card_number"
           required>

    <br><br>

    <label>Expiry Date:</label>
    <input type="month"
           name="expiry"
           required>

    <br><br>

    <label>CVV:</label>
    <input type="password"
           name="cvv"
           required>

    <br><br>

    <button type="submit">Pay Now</button>

</form>

</body>
</html>
