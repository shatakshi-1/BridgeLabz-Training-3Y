<!DOCTYPE html>
<html>
<head>

    <!-- Sets the title displayed in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Provides a description of the webpage -->
    <meta name="description"
          content="A webpage demonstrating important HTML head elements.">

    <!-- Specifies the author of the webpage -->
    <meta name="author"
          content="Shatakshi">

    <!-- Sets the base URL for relative URLs -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Used for CSS styling -->
    <style>
    </style>

    <!-- Used for JavaScript -->
    <script>
    </script>

</head>

<body>

<h1>Important HTML Head Elements</h1>

<p>
    This page demonstrates important HTML head elements.
</p>

</body>
</html>
