<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

<h1>City - Mathura</h1>

<!-- loading="lazy" loads the map only when it is close to becoming visible. -->
<iframe
    src="https://www.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh%2C%20India&output=embed"
    title="Google Map showing Mathura"
    width="600"
    height="450"
    loading="lazy">
</iframe>

</body>
</html>
