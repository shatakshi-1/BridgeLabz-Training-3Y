<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>

<h1>Contact Us</h1>

<form action="#" method="post">

    <label>Full Name:</label>
    <input type="text"
           name="fullname"
           placeholder="Enter your full name"
           required>

    <br><br>

    <label>Email:</label>
    <input type="email"
           name="email"
           placeholder="Enter your email"
           required>

    <br><br>

    <label>Subject:</label>
    <input type="text"
           name="subject"
           placeholder="Enter subject"
           required>

    <br><br>

    <label>Message:</label>
    <br>

    <textarea name="message"
              rows="6"
              cols="40"
              placeholder="Write your message here"
              required></textarea>

    <br><br>

    <button type="submit">Send Message</button>

</form>

</body>
</html>
