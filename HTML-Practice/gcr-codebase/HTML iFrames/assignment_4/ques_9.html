<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
</head>
<body>

<h1>File Upload Form</h1>

<form action="#" method="post" enctype="multipart/form-data">

    <label>Select File:</label>

    <input type="file"
           name="file"
           accept=".jpg,.png">

    <br><br>

    <button type="submit">Upload</button>

</form>

<p>
    Allowed file types: JPG and PNG images only.
</p>

</body>
</html>
