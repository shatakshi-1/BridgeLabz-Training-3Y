<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>

<h1>My Form</h1>

<form action="result.html"
      method="get"
      target="result">

    <label>Enter Text:</label>

    <input type="text"
           name="text"
           required>

    <button type="submit">
        Submit
    </button>

</form>

<br>

<iframe
    src="about:blank"
    name="result"
    width="80%"
    height="150"
    title="Result">
</iframe>

</body>
</html>
